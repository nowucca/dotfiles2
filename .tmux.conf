# =============================================================================
# tmux configuration
# =============================================================================
# Prefix: Ctrl+A (like screen)
# Reload: Ctrl+A r
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------

# Use Ctrl+A as the prefix key (like screen)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable 256 colors and true color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Faster command sequences (reduce escape time)
set -s escape-time 10

# Increase scrollback buffer
set -g history-limit 50000

# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Don't rename windows automatically
set -g allow-rename off

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# -----------------------------------------------------------------------------
# Key Bindings
# -----------------------------------------------------------------------------

# Reload config file
unbind r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Use Vim shortcuts
setw -g mode-keys vi

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with Ctrl+hjkl (repeatable)
bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

# Quick window switching with Alt+number (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick pane switching with Alt+arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Sync panes toggle (type in all panes simultaneously)
bind S setw synchronize-panes

# -----------------------------------------------------------------------------
# Copy Mode (Vim-style)
# -----------------------------------------------------------------------------

# Enter copy mode with prefix + [
# v to start selection, y to copy, q to quit

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste with prefix + p
bind p paste-buffer

# -----------------------------------------------------------------------------
# Status Bar
# -----------------------------------------------------------------------------

# Update status bar every 5 seconds
set -g status-interval 5

# Status bar position
set -g status-position bottom

# Status bar colors (Solarized-inspired)
set -g status-style bg=colour235,fg=colour136

# Left side: session name
set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour136,bold] #S #[fg=colour136,bg=colour235]"

# Right side: hostname and time
set -g status-right-length 50
set -g status-right "#[fg=colour244]#h #[fg=colour136] #[fg=colour244]%H:%M"

# Window status
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour235,bg=colour136] #I:#W #[fg=colour136,bg=colour235]"

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour136

# Message styling
set -g message-style bg=colour136,fg=colour232,bold

# -----------------------------------------------------------------------------
# Plugins (optional - requires TPM)
# -----------------------------------------------------------------------------
